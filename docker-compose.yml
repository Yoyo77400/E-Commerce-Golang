name: go-ecommerce

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shopify}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopify} -d ${POSTGRES_DB:-shopify}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: .
    command: ["server"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shopify}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopify}?sslmode=disable
      HTTP_ADDR: ":8080"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@esgi.fr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?define ADMIN_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # TUI interactive : lancée à la demande avec `docker compose run --rm client`
  client:
    build: .
    command: ["client"]
    profiles: ["client"]
    stdin_open: true
    tty: true
    environment:
      API_URL: http://server:8080
    depends_on:
      - server

  # TUI admin : lancée à la demande avec `docker compose run --rm admin`
  admin:
    build: .
    command: ["admin"]
    profiles: ["admin"]
    stdin_open: true
    tty: true
    environment:
      API_URL: http://server:8080
    depends_on:
      - server

volumes:
  db-data: